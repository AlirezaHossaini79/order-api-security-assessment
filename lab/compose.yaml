services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: lab
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 2s
      retries: 20
  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://lab:synthetic-local-only@db:5432/lab
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
