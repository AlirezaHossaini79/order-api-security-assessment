services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: lab
    secrets:
      - db_admin_password
      - db_app_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-lab.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 2s
      retries: 20
  api:
    build: ./app
    environment:
      DB_HOST: db
      DB_NAME: lab
      DB_USER: lab_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_app_password
    ports:
      - "${LAB_BIND_ADDRESS:-127.0.0.1}:${LAB_PORT:-18080}:8080"
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
networks:
  frontend:
  backend:
    internal: true
secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_app_password:
    file: ./secrets/db_app_password
